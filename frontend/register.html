<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un stand | UCAO UUT Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <form class="panel auth-card" id="registerForm">
      <a class="brand" href="index.html"><span class="brand__mark"><i data-lucide="graduation-cap"></i></span><span><strong>UCAO</strong> Market</span></a>
      <h1>Créer mon compte</h1>
      <p>Publiez votre stand après validation par l’équipe UCAO UUT.</p>
      <div class="form-grid">
        <label>Nom complet<input class="input" name="name" required minlength="2"></label>
        <label>Email universitaire<input class="input" name="email" type="email" required></label>
      </div>
      <label>Téléphone vendeur<input class="input" name="phone" type="tel" placeholder="+221 77 000 00 00"></label>
      <label>Mot de passe<input class="input" name="password" type="password" required minlength="8"></label>
      <div id="authMessage"></div>
      <button class="btn btn--primary" type="submit"><i data-lucide="user-plus"></i> Créer le compte</button>
      <a href="login.html">J’ai déjà un compte</a>
    </form>
  </main>
</body>
</html>
