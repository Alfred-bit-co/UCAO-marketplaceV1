<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | UCAO UUT Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <form class="panel auth-card" id="loginForm">
      <a class="brand" href="index.html"><span class="brand__mark"><i data-lucide="graduation-cap"></i></span><span><strong>UCAO</strong> Market</span></a>
      <h1>Connexion</h1>
      <p>Accédez à votre tableau de bord vendeur ou administrateur.</p>
      <label>Email<input class="input" name="email" type="email" autocomplete="email" required></label>
      <label>Mot de passe<input class="input" name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <div id="authMessage"></div>
      <button class="btn btn--primary" type="submit"><i data-lucide="log-in"></i> Se connecter</button>
      <a href="register.html">Créer un compte</a>
    </form>
  </main>
</body>
</html>
